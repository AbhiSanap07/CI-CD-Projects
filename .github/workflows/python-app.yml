name: Python CI

On:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs: 
    test:
        run-on: ubuntu-latest

        steps:
            - name: Checkout code 
              uses: action/checkout@v4


            - name: Set up python 
              uses: actions/setup-python@v5

              with:
                python-version: "3.10" 

            - name: Install dependencies
              run: |
                pyton -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Run tests
              run: pytest